name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        # actions/setup-python v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q src

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test CLI
        shell: pwsh
        run: |
          mcp-guard --version
          mcp-guard scan examples/risky-mcp-server.json --format json
          if ($LASTEXITCODE -ne 1) {
            throw "Expected risky example scan to exit with status 1, got $LASTEXITCODE"
          }
          mcp-guard --help
