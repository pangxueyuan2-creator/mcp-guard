name: CI

on:
  push:
    branches: [main, upgrade/v0.2-security-engine]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q src

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test CLI
        run: |
          mcp-guard --version
          mcp-guard scan examples/risky-mcp-server.json --format json || test $? -eq 1
          mcp-guard scan examples/risky-mcp-server.json --format sarif --output mcp-guard.sarif || test $? -eq 1

      - name: Upload SARIF smoke-test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-guard-sarif-py${{ matrix.python-version }}
          path: mcp-guard.sarif
          if-no-files-found: ignore
